<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <title>{{TITLE}}</title>
    <script src="vendor/gsap-3.14.2.min.js"></script>
    <script src="mk/motion-kit.js"></script>
    <script src="mk/motion-fx.js"></script>
    <script src="mk/motion-shots.js"></script>
    <script src="data.js"></script>
    <style>
{{FONT_CSS}}
{{LOOK_CSS}}
      /* ---- scaffold layout (Video Mania templates/composition) ---- */
      body { margin: 0; background: var(--mk-ground); }
      #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; font-family: var(--mk-ui); color: var(--mk-ink); }
      .layer { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; }
      .scene { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; opacity: 0; visibility: hidden; }
      #bg { z-index: 0; } #world { z-index: 1; } #scenes { z-index: 2; } #vignette { z-index: 40; pointer-events: none; }
      /* safe zone for 9:16 feeds: words and logos between y 250 and y 1420, out of the right 120 px */
      #captions { position: absolute; left: 50px; right: 50px; top: {{CAP_TOP}}px; height: 220px; z-index: 50; }
      .cue { position: absolute; left: 0; right: 0; top: 0; margin: 0 auto; width: fit-content; max-width: {{CAP_MAXW}}px;
             padding: 12px 30px 16px; border-radius: 22px; background: var(--mk-cap-bg); color: var(--mk-cap-ink);
             box-shadow: inset 0 0 0 2px var(--mk-cap-edge); font-family: var(--mk-ui); font-weight: 800;
             font-size: {{CAP_PX}}px; line-height: 1.16; text-align: center; letter-spacing: -0.01em; }
      .cue .ln { display: block; white-space: nowrap; }
      .cue.chunk { text-transform: uppercase; font-size: {{CHUNK_PX}}px; }
      /* type-kit captions (default): full-frame layer, TK.captions places each cue (typography/README.md) */
      #captions.tk { left: 0; right: 0; top: 0; width: {{W}}px; height: {{H}}px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="{{W}}" data-height="{{H}}" data-duration="{{DUR}}">
      <div id="bg" class="layer mk-bg"></div>
      <div id="world" class="layer"></div>
      <div id="scenes" class="layer">
        <!-- one <div class="scene" id="s01"> per beat; footage <video> layers sit in non-timed wrappers -->
      </div>
      <div id="vignette" class="layer mk-vignette"></div>
      <div id="captions" class="{{CAP_CLASS}}"></div>
      <audio id="mix" src="audio/mix.wav" data-start="0" data-duration="{{DUR}}" data-volume="1"></audio>
    </div>
    <script>
      // One paused timeline for the whole film. Every helper adds seek-safe tweens to it.
      // Rules: references/motion-design-playbook.md (§3 one object changing shape, §13 craft laws),
      // hyperframes-animation rules/blueprints, storytelling-and-retention.md (one persistent world).
      const DUR = {{DUR}}, W = {{W}}, H = {{H}};
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      const $ = (q) => document.querySelector(q);

      /** Show a scene between start and end (seek-safe sets; overlap scenes for bridges). */
      function scene(id, start, end, build) {
        const s = document.getElementById(id);
        tl.set(s, { opacity: 0, visibility: "hidden" }, 0);
        tl.set(s, { opacity: 1, visibility: "visible" }, Math.max(0.0001, start));
        if (end < DUR) tl.set(s, { opacity: 0, visibility: "hidden" }, end);
        build(s, start, end);
      }

      // Build only after every font face is loaded: text is split, measured and (for particle
      // words) rasterised at build time, and frame 0 must never paint in a fallback font.
      async function build() {
      await Promise.all(["800 100px 'Barlow Condensed'", "400 100px Inter", "800 100px Inter", "900 100px Inter",
        "400 100px 'JetBrains Mono'", "700 100px 'JetBrains Mono'", "400 100px 'EB Garamond'"].map((f) => document.fonts.load(f)));
      // the 7-font type kit (typography/): Impact, Helvetica→Inter, Garamond→EB Garamond, Cormorant Garamond,
      // Rockwell→Arvo, Snell Roundhand→Great Vibes, Blacksword→Italianno (each labelled in FONT-LICENSE-REPORT.md)
      if (window.TK) { TK.init({ W, H, fps: 30 }); await TK.load(); }
      await document.fonts.ready;

      // ---- scenes go here (one per beat of the motion brief's scene chain) ----
      // scene("s01", 0, 3.2, (s, t0) => {
      //   MKFX.headline(tl, s, t0 + 0.15, { x: 90, y: 360, w: 900, lines: ["one idea", "per beat"], size: 150, accentWord: "beat" });
      // });

      // ---- captions (data.js from caption_track.py) ----
      // type (default): TK.captions, preset MULTI_FONT_STORYTELLING — Helvetica-style body, Garamond italic payoff,
      // Impact problem word, depth shadow, stack <-> line rhythm, always bottom-centre on one baseline
      // (house rule 2026-10-22; references/typography-and-captions.md §4). CAP_PLAN may only change a cue's style.
      const CAP_PLAN = {};   // cue start (s) → { style: "stack"|"line" }
      if (window.CUES && {{TK_CAPS}}) {
        TK.captions(tl, "#captions", window.CUES, {
          preset: "{{CAP_PRESET}}", scale: {{CAP_SCALE}},
          skip: (c) => (window.CAP_OFF || []).some(([a, b]) => c.s >= a && c.s < b),
          layout: (c, i) => ({ x: W / 2, y: H - {{CAP_BOTTOM}}, align: "center", style: i % 2 ? "line" : "stack", ...(CAP_PLAN[c.s] || {}) }),
        });
      } else if (window.CUES) {
        MK.captions(tl, "#captions", window.CUES, { off: window.CAP_OFF || [], className: "cue" + ({{CHUNK}} ? " chunk" : "") });
      }
      MK.grain(tl, "#root", DUR, { w: W, h: H, opacity: {{GRAIN}} });
      MK.pad(tl, DUR);
      window.__timelines["main"] = tl;
      }
      build();
    </script>
  </body>
</html>
